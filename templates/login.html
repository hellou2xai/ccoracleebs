<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — U2xAI EBS Agentic Apps</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #1a1f2e 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(31,111,235,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31,111,235,.06) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridMove 20s linear infinite;
    }
    @keyframes gridMove {
      0%   { transform: translate(0, 0); }
      100% { transform: translate(60px, 60px); }
    }

    /* Floating orbs */
    .orb {
      position: fixed; border-radius: 50%; filter: blur(80px); opacity: .15; pointer-events: none;
    }
    .orb-1 { width: 400px; height: 400px; background: #1f6feb; top: -100px; right: -100px; animation: float1 15s ease-in-out infinite; }
    .orb-2 { width: 300px; height: 300px; background: #8b5cf6; bottom: -80px; left: -80px; animation: float2 18s ease-in-out infinite; }
    .orb-3 { width: 200px; height: 200px; background: #06d6a0; top: 50%; left: 50%; animation: float3 12s ease-in-out infinite; }
    @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-40px,30px); } }
    @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,-40px); } }
    @keyframes float3 { 0%,100% { transform: translate(-50%,-50%); } 50% { transform: translate(-40%,-60%); } }

    .login-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      background: rgba(22, 27, 34, .85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(48, 54, 61, .6);
      border-radius: 16px;
      padding: 40px 36px 36px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4), 0 0 40px rgba(31,111,235,.08);
    }

    .login-logo {
      text-align: center; margin-bottom: 28px;
    }
    .login-logo-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #1f6feb, #8b5cf6);
      border-radius: 14px;
      font-size: 24px; color: #fff;
      margin-bottom: 14px;
      box-shadow: 0 4px 20px rgba(31,111,235,.3);
    }
    .login-logo h1 {
      font-size: 22px; font-weight: 700; color: #e6edf3;
      margin: 0 0 2px;
    }
    .login-logo h1 span { color: #1f6feb; }
    .login-logo p {
      font-size: 13px; color: #8b949e; margin: 0;
    }

    .login-label {
      font-size: 12px; font-weight: 600; color: #8b949e;
      text-transform: uppercase; letter-spacing: .5px;
      margin-bottom: 6px;
    }
    .login-input {
      background: rgba(13, 17, 23, .7);
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      padding: 10px 14px;
      font-size: 14px;
      transition: border-color .15s, box-shadow .15s;
    }
    .login-input::placeholder { color: #484f58; }
    .login-input:focus {
      background: rgba(13, 17, 23, .9);
      border-color: #1f6feb;
      box-shadow: 0 0 0 3px rgba(31,111,235,.15);
      outline: none; color: #e6edf3;
    }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #1f6feb, #1a5fd4);
      border: none; border-radius: 8px;
      color: #fff; font-size: 14px; font-weight: 600;
      padding: 11px 0;
      cursor: pointer;
      transition: transform .1s, box-shadow .15s;
      margin-top: 8px;
    }
    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(31,111,235,.35);
    }
    .btn-login:active { transform: translateY(0); }

    .login-alert {
      background: rgba(248,81,73,.12);
      border: 1px solid rgba(248,81,73,.3);
      border-radius: 8px;
      color: #f85149;
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: none;
    }
    .login-alert.show { display: block; }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 11px;
      color: #484f58;
    }
  </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="login-card">
  <div class="login-logo">
    <div class="login-logo-icon"><i class="fa-solid fa-database"></i></div>
    <h1><span>U2xAI</span> EBS Agentic Apps</h1>
    <p>AI-powered Oracle EBS Support Platform</p>
  </div>

  <div class="login-alert" id="loginAlert">Invalid username or password.</div>

  <form method="POST" action="/login" id="loginForm">
    <div class="mb-3">
      <label class="login-label">Username</label>
      <input type="text" name="username" class="form-control login-input"
             placeholder="Enter username" autofocus required />
    </div>
    <div class="mb-3">
      <label class="login-label">Password</label>
      <input type="password" name="password" class="form-control login-input"
             placeholder="Enter password" required />
    </div>
    <button type="submit" class="btn-login">
      <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
    </button>
  </form>

  <div class="login-footer">
    Powered by U2xAI &middot; Claude AI
  </div>
</div>

{% if error %}
<script>document.getElementById('loginAlert').classList.add('show');</script>
{% endif %}

</body>
</html>
