services:
  - type: web
    name: ebs-support-agent
    runtime: docker
    plan: starter
    envVars:
      # Oracle EBS Database
      - key: ORACLE_HOST
        value: apps.example.com
      # Optional IP override for the Oracle host (added to /etc/hosts at startup).
      # Leave unset so DNS resolves apps.example.com. The host runs on a dynamic
      # IP, so a pinned value goes stale and the app silently falls back to demo
      # mode. Only set this in the Render dashboard if DNS is unavailable.
      - key: ORACLE_HOST_IP
        sync: false
      - key: ORACLE_PORT
        value: "1521"
      - key: ORACLE_SID
        sync: false
      - key: ORACLE_SERVICE_NAME
        sync: false
      - key: ORACLE_USER
        sync: false
      - key: ORACLE_PASSWORD
        sync: false
      - key: ORACLE_CLIENT_DIR
        value: /opt/oracle/instantclient
      # Application
      - key: DEMO_MODE
        value: "false"
      - key: BUNDLE_PATH
        value: /app/bundle_2026-Mar-01/MENU/analyzers/SQL
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      # Anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      # JIRA
      - key: JIRA_BASE_URL
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
