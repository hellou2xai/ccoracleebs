###############################################################################
# Collect the Order and Service Management setup information
###############################################################################

#------------------------------------------------------------------------------
# Module definition
#------------------------------------------------------------------------------
col=${B_IN_USE}
dsc='Collects Oracle Communications Order and Service Management Information'
fam=Unix
pre=RDA:DCbegin
rpt=B_IN_USE
var=not_used  # Flow:in_use,B_IN_USE
exe=sdcl {
"var @{AUX.var} = cond(${PRF.B_TESTS},'in_use','B_IN_USE')
}

#------------------------------------------------------------------------------
# Setting definitions
#------------------------------------------------------------------------------
[in_use]
typ=B
dft=true
dsc='Is Order and Service Management information requested?'
nam=B_IN_USE
var=D_DOMAIN,N_LIMIT

[not_used]
typ=B
dft=false
dsc='Is Order and Service Management information requested?'
nam=B_IN_USE

[B_IN_USE]
typ=B
dft=${AUX.B_SELECTED}
dsc='Is Order and Service Management information requested?'
inp='Do you want RDA to analyze Oracle Communications Order and Service \
     Management (Y/N)?'
var=true:D_DOMAIN,N_LIMIT

[D_DOMAIN]
typ=D
dsc='Order and Service Management domain directory'
err='Warning: The specified directory does not -yet- exist'
inp='Enter the Order and Service Management WebLogic Server domain directory'
val=W

[N_LIMIT]
typ=N
dft=5000
dsc='Number of lines of domain server log files to retain'
err='The size must be an integer greater than zero'
inp='Enter the number of lines domain log file data to include'
ref='I]0,['
val=E

