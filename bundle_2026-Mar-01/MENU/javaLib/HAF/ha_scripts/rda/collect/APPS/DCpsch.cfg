###############################################################################
# Collect PeopleSoft setup information for Process scheduler
###############################################################################

#------------------------------------------------------------------------------
# Module definition
#------------------------------------------------------------------------------
col=${B_IN_USE}
dsc='Collects PeopleSoft Information from Process Scheduler'
pre=APPS:DCpsft
rpt=B_IN_USE
var=not_used  # Flow:in_use,B_IN_USE
exe=sdcl {
"if ${GRP.PSFT.B_IN_USE}
" var @{AUX.var} = (cond(${PRF.B_TESTS},'in_use','B_IN_USE'))
}

#------------------------------------------------------------------------------
# Setting definitions
#------------------------------------------------------------------------------
[in_use]
typ=B
dft=true
dsc='Is PeopleSoft information from process scheduler requested?'
nam=B_IN_USE

[not_used]
typ=B
dft=false
dsc='Is PeopleSoft information from process scheduler requested?'
nam=B_IN_USE

[B_IN_USE]
typ=B
dft=${AUX.B_SELECTED}
dsc='Is PeopleSoft information from process scheduler requested?'
inp='Should RDA analyze PeopleSoft information from process scheduler (Y/N)?'
